name: Send Chapter Newsletter

on:
  push:
    paths:
      - "src/content/chapters/**"

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for new chapter
        id: chapter
        run: |
          NEW_FILE=$(git diff --name-status HEAD^ HEAD | grep "^A.*src/content/chapters/chapter-" || true)

          echo "Detected files:"
          git diff --name-status HEAD^ HEAD

          if [ -n "$NEW_FILE" ]; then
            echo "new_chapter=true" >> $GITHUB_OUTPUT
            echo "New chapter detected:"
            echo "$NEW_FILE"
          else
            echo "new_chapter=false" >> $GITHUB_OUTPUT
            echo "No new chapter detected"
          fi

      - name: Send newsletter
        if: steps.chapter.outputs.new_chapter == 'true'
        run: node .github/scripts/send-newsletter.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          CHAPTER_FILE: ${{ steps.chapter.outputs.chapter_file }}